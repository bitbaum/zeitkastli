# pnpm 11 blocks dependency postinstall scripts by default; these two need
# their builds: esbuild installs its platform binary, unrs-resolver its
# native resolver (used by eslint-config-next).
allowBuilds:
  esbuild: true
  unrs-resolver: true

overrides:
  # Security floors (2026-10-30 dev-toolchain sweep): stay inside the
  # major the parents already allow; pnpm does not re-resolve these on update.
  "vite@8": "^8.2.4"
